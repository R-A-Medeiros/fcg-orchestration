# ConfigMap com os schemas de cada serviço, consumido pelo Job db-migrate.
#
# IMPORTANTE: este arquivo é uma CÓPIA dos db/init.sql de cada serviço. Se algum
# schema mudar, regenere com:
#
#   kubectl create configmap db-schemas \
#     --from-file=users.schema.sql=../users-api/db/init.sql \
#     --from-file=catalog.schema.sql=../catalog-api/db/init.sql \
#     --from-file=payments.schema.sql=../payments-api/db/init.sql \
#     --dry-run=client -o yaml > db-schemas-configmap.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-schemas
  labels:
    app: db-migrate
data:
  users.schema.sql: |
    CREATE TABLE IF NOT EXISTS "__EFMigrationsHistory" (
        "MigrationId" character varying(150) NOT NULL,
        "ProductVersion" character varying(32) NOT NULL,
        CONSTRAINT "PK___EFMigrationsHistory" PRIMARY KEY ("MigrationId")
    );

    START TRANSACTION;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901151640_InitialCreate') THEN
        CREATE TABLE users (
            "Id" bigint GENERATED BY DEFAULT AS IDENTITY,
            "Name" character varying(150) NOT NULL,
            "Email" character varying(200) NOT NULL,
            "Password" text NOT NULL,
            "UserIdentifier" uuid NOT NULL,
            "Role" character varying(50) NOT NULL,
            "CreatedAt" timestamp with time zone NOT NULL,
            CONSTRAINT "PK_users" PRIMARY KEY ("Id")
        );
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901151640_InitialCreate') THEN
        CREATE UNIQUE INDEX "IX_users_Email" ON users ("Email");
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901151640_InitialCreate') THEN
        CREATE UNIQUE INDEX "IX_users_UserIdentifier" ON users ("UserIdentifier");
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901151640_InitialCreate') THEN
        INSERT INTO "__EFMigrationsHistory" ("MigrationId", "ProductVersion")
        VALUES ('20260901151640_InitialCreate', '10.0.11');
        END IF;
    END $EF$;
    COMMIT;
  catalog.schema.sql: |
    CREATE TABLE IF NOT EXISTS "__EFMigrationsHistory" (
        "MigrationId" character varying(150) NOT NULL,
        "ProductVersion" character varying(32) NOT NULL,
        CONSTRAINT "PK___EFMigrationsHistory" PRIMARY KEY ("MigrationId")
    );

    START TRANSACTION;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901171312_InitialCreate') THEN
        CREATE TABLE games (
            "Id" uuid NOT NULL,
            "Title" character varying(200) NOT NULL,
            "Description" character varying(2000) NOT NULL,
            "Price" numeric(10,2) NOT NULL,
            "Genre" character varying(100) NOT NULL,
            "CreatedAt" timestamp with time zone NOT NULL,
            CONSTRAINT "PK_games" PRIMARY KEY ("Id")
        );
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901171312_InitialCreate') THEN
        CREATE TABLE library_items (
            "Id" uuid NOT NULL,
            "UserId" uuid NOT NULL,
            "GameId" uuid NOT NULL,
            "GameTitle" character varying(200) NOT NULL,
            "PricePaid" numeric(10,2) NOT NULL,
            "AddedAt" timestamp with time zone NOT NULL,
            CONSTRAINT "PK_library_items" PRIMARY KEY ("Id")
        );
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901171312_InitialCreate') THEN
        CREATE TABLE orders (
            "Id" uuid NOT NULL,
            "UserId" uuid NOT NULL,
            "GameId" uuid NOT NULL,
            "GameTitle" character varying(200) NOT NULL,
            "Price" numeric(10,2) NOT NULL,
            "Status" character varying(20) NOT NULL,
            "CreatedAt" timestamp with time zone NOT NULL,
            "ResolvedAt" timestamp with time zone,
            CONSTRAINT "PK_orders" PRIMARY KEY ("Id")
        );
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901171312_InitialCreate') THEN
        CREATE UNIQUE INDEX "IX_library_items_UserId_GameId" ON library_items ("UserId", "GameId");
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901171312_InitialCreate') THEN
        INSERT INTO "__EFMigrationsHistory" ("MigrationId", "ProductVersion")
        VALUES ('20260901171312_InitialCreate', '10.0.11');
        END IF;
    END $EF$;
    COMMIT;
  payments.schema.sql: |
    CREATE TABLE IF NOT EXISTS "__EFMigrationsHistory" (
        "MigrationId" character varying(150) NOT NULL,
        "ProductVersion" character varying(32) NOT NULL,
        CONSTRAINT "PK___EFMigrationsHistory" PRIMARY KEY ("MigrationId")
    );

    START TRANSACTION;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901174853_InitialCreate') THEN
        CREATE TABLE payments (
            "Id" uuid NOT NULL,
            "OrderId" uuid NOT NULL,
            "UserId" uuid NOT NULL,
            "GameId" uuid NOT NULL,
            "Amount" numeric(10,2) NOT NULL,
            "Result" character varying(20) NOT NULL,
            "Reason" character varying(300) NOT NULL,
            "ProcessedAt" timestamp with time zone NOT NULL,
            CONSTRAINT "PK_payments" PRIMARY KEY ("Id")
        );
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901174853_InitialCreate') THEN
        CREATE UNIQUE INDEX "IX_payments_OrderId" ON payments ("OrderId");
        END IF;
    END $EF$;

    DO $EF$
    BEGIN
        IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20260901174853_InitialCreate') THEN
        INSERT INTO "__EFMigrationsHistory" ("MigrationId", "ProductVersion")
        VALUES ('20260901174853_InitialCreate', '10.0.11');
        END IF;
    END $EF$;
    COMMIT;
